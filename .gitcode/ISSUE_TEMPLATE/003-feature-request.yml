name: 🚀 Feature request
description: Submit a proposal/request for a new MindSpore GoldenStick feature
title: "[Feature] "
labels: ["feature"]

body:
- type: textarea
  attributes:
    label: 🚀 背景描述
    description: >
      A clear and concise description of the feature proposal. Please outline the motivation for the proposal. Is your feature request related to a specific problem? e.g., *"I'm working on X and would like Y to be possible"*. If this is related to another AtomGit issue, please link here too.
  validations:
    required: true
- type: textarea
  attributes:
    label: 设计思路
    description: >
      A description of any alternative solutions or features you've considered, if any.
  validations:
    required: true
- type: textarea
  attributes:
    label: 安全分析与DFX设计
    description: >
      描述该特性是否需要进行安全分析和DFX设计. 
    placeholder: |
      请分析以下项，若涉及需给出对应措施，若不涉及需明确标注不涉及:
      - 该特性是否涉及对外交互，外部调用入参是否合法（需排查入参是否支持命令和二进制库注入等）.
      - 该特性是否涉及通信及网络传输（需考虑加密、鉴权、通信端口矩阵报备等）.
      - 该特性是否涉及多进程和多线程的管理（需考虑进程监控，异常退出，共享数据一致性等）.
      - 该特性是否涉及敏感数据的读取与保存，以及文件与目录权限管理.
      - 该特性是否引入第三方软件.
      - 高可用和高可靠设计.
      - 其他DFX设计.
- type: textarea
  attributes:
    label: 涉及到的对外API
    description: >
      描述该特性是否会有对外API的增加与变更情况的发生，以及变更可能会造成的周边影响.
- type: textarea
  attributes:
    label: 与其他模块的相关性描述
    description: >
      描述与其他模块存在的可能关联性，以方便补充对应的场景验证.
- type: textarea
  attributes:
    label: 测试设计与测试计划
    description: >
      详细描述如何开展测试验证，以保证该特性的能力得到充分的验证，包括到不限于功能、性能、可靠性、安全等.
  validations:
    required: true
- type: textarea
  attributes:
    label: 其他信息
    description: >
      添加例如辅助信息、测试验证场景等内容.
- type: markdown
  attributes:
    value: >
      Thanks for contributing 🎉!

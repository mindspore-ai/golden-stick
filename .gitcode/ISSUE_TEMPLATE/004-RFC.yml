name: 💬 Request for comments (RFC).
description: Ask for feedback on major architectural changes or design choices.
title: "[RFC] "
labels: ["RFC"]

body:
- type: textarea
  attributes:
    label: 背景与目标描述.
    description: >
      The motivation of the RFC.
  validations:
    required: true
- type: textarea
  attributes:
    label: 建议的方案.
    description: >
      The proposed change of the RFC.
  validations:
    required: true
- type: textarea
  attributes:
    label: 安全分析与DFX设计
    description: >
      描述该特性是否需要进行安全分析和DFX设计. 
    placeholder: |
      请分析以下项，若涉及需给出对应措施，若不涉及需明确标注不涉及:
      - 该特性是否涉及对外交互，外部调用入参是否合法（需排查入参是否支持命令和二进制库注入等）.
      - 该特性是否涉及通信及网络传输（需考虑加密、鉴权、通信端口矩阵报备等）.
      - 该特性是否涉及多进程和多线程的管理（需考虑进程监控，异常退出，共享数据一致性等）.
      - 该特性是否涉及敏感数据的读取与保存，以及文件与目录权限管理.
      - 该特性是否引入第三方软件.
      - 高可用和高可靠设计.
      - 其他DFX设计.
- type: textarea
  attributes:
    label: 涉及到的对外API
    description: >
      描述该特性是否会有对外API的增加与变更情况的发生，以及变更可能会造成的周边影响.
- type: textarea
  attributes:
    label: 测试验证
    description: >
      详细描述针对该方案，如何开展测试验证，以保证该特性的合入后对应的能力得到充分验证，包括到不限于功能、性能、可靠性、安全等.
  validations:
    required: true
- type: textarea
  attributes:
    label: 期望的反馈时间.
    description: >
      The feedback period of the RFC. Usually at least one week.
  validations:
    required: false
- type: textarea
  attributes:
    label: CC List.
    description: >
      The list of people you want to CC.
  validations:
    required: false
- type: textarea
  attributes:
    label: 其他补充信息.
    description: >
      Any other things you would like to mention.
  validations:
    required: false
- type: markdown
  attributes:
    value: >
      Thanks for contributing 🎉! The mindspore core team hosts a biweekly RFC review session, while most RFCs can be discussed online, you can optionally sign up for a slot to discuss your RFC online.
- type: checkboxes
  attributes:
    label: Before submitting a new issue...
    options:
      - label: Make sure you already searched for previous [RFCs](https://atomgit.com/mindspore/golden-stick/issues?q=is%3Aall+label%3ARFC+sort%3Arecently-updated).
        required: true

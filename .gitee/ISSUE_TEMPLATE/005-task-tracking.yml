name: 🧭 Task Tracking
description: Task tracking derived from Feature/RFC
title: "[Task] "
labels: ["task"]
body:
  - type: input
    attributes:
      label: 父任务
      description: 从哪个任务分解出来
      placeholder: 自规划/#xxxxxx
    validations:
      required: true

  - type: input
    attributes:
      label: 前置依赖的任务
      description: 前置依赖的任务，可以有多个依赖项
      placeholder: #xxxxxx #xxxxxx #xxxxxx
    validations:
      required: false

  - type: textarea
    attributes:
      label: 子工作项（分解）
      description: List concrete sub-tasks as a checklist.
      placeholder: |-
        例如：
        - [ ] 设计方案评审（含接口与兼容性）
        - [ ] 关键模块实现（A/B/C）
        - [ ] 单元测试与集成测试
        - [ ] 文档与示例更新
        - [ ] 性能与稳定性验证
    validations:
      required: true

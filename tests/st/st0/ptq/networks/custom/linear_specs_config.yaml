# LinearSpec configuration for mixed precision network
# Standard Linear: 4 types × 3 data types × 2 strategies = 24 layers
# GroupedLinear: 2 types × 3 data types × 2 strategies = 12 layers
# Total: 36 layers

# Data types configuration
data_types:
  - name: "float16"
    compute_dtype: "float16"
    param_dtype_str: "float16"
  - name: "bfloat16"
    compute_dtype: "bfloat16"
    param_dtype_str: "bfloat16"
  - name: "float32"
    compute_dtype: "float32"
    param_dtype_str: "float32"

# Layer type configurations
layer_types:
  - name: "ColumnParallelLinear"
    strategies_per_dtype: 2
    params:
      input_size: "${hidden_size}"
      output_size: "${hidden_size}"
    
  - name: "RowParallelLinear"
    strategies_per_dtype: 2
    params:
      input_size: "${hidden_size}"
      output_size: "${hidden_size}"
    
  - name: "QKVParallelLinear"
    strategies_per_dtype: 2
    params:
      hidden_size: "${hidden_size}"
      head_size: "${hidden_size // 8}"
      total_num_heads: 8
      total_num_kv_heads: 8
    
  - name: "MergedColumnParallelLinear"
    strategies_per_dtype: 2
    params:
      hidden_size: "${hidden_size}"
      ffn_hidden_size: "${hidden_size}"
    
  - name: "ColumnParallelGroupedLinear"
    strategies_per_dtype: 2
    params:
      input_size: "${hidden_size}"
      output_size: "${hidden_size}"
      num_local_experts: "${num_experts}"
    
  - name: "RowParallelGroupedLinear"
    strategies_per_dtype: 2
    params:
      input_size: "${hidden_size}"
      output_size: "${hidden_size}"
      num_local_experts: "${num_experts}"

